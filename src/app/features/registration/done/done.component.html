<app-registration-layout [currentStep]="4" [totalSteps]="4">
  <div class="done-content">
    <div class="done-badge">
      <i class="pi pi-check-circle"></i>
    </div>
    <h1 class="done-title">You're All Set!</h1>

    <ul class="done-features">
      <li>
        <i class="pi pi-check-circle"></i>
        <span>Make Payments</span>
      </li>
      <li>
        <i class="pi pi-check-circle"></i>
        <span>Set up Autopay</span>
      </li>
      <li>
        <i class="pi pi-check-circle"></i>
        <span>Enroll for Paperless Statements</span>
      </li>
    </ul>
  </div>

  <div actions class="done-actions">
    <p-button
      label="Go to Login"
      icon="pi pi-sign-in"
      iconPos="right"
      (onClick)="onLogin()"
      [style]="{ width: '100%' }"
      size="large"
      styleClass="aca-btn-primary"
    />
  </div>

  <p footer>
    Thank you for choosing American Credit Acceptance.
  </p>
</app-registration-layout>
