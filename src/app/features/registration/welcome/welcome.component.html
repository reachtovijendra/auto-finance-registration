<app-registration-layout [currentStep]="1">
  <div class="welcome-hero">
    <!-- Auto-finance illustration -->
    <div class="welcome-illustration">
      <div class="illustration-circle">
        <div class="illustration-inner">
          <i class="pi pi-car"></i>
        </div>
      </div>
      <div class="illustration-orbit">
        <div class="orbit-item orbit-item-1">
          <i class="pi pi-shield"></i>
        </div>
        <div class="orbit-item orbit-item-2">
          <i class="pi pi-wallet"></i>
        </div>
        <div class="orbit-item orbit-item-3">
          <i class="pi pi-file"></i>
        </div>
      </div>
    </div>

    <h1 class="welcome-greeting">Hi {{ firstName() }},</h1>
    <p class="welcome-message">
      Congratulations on the purchase of your vehicle.
    </p>
    <p class="welcome-submessage">
      Let's get you set up. This should take only a few minutes!
    </p>

    <!-- Feature highlights -->
    <div class="welcome-features">
      <div class="feature-item">
        <i class="pi pi-wallet"></i>
        <span>Manage Payments</span>
      </div>
      <div class="feature-item">
        <i class="pi pi-chart-line"></i>
        <span>Track Balance</span>
      </div>
      <div class="feature-item">
        <i class="pi pi-file"></i>
        <span>View Statements</span>
      </div>
    </div>
  </div>

  <div terms class="terms-section">
    <p-checkbox
      [(ngModel)]="termsAccepted"
      [binary]="true"
      inputId="terms"
    />
    <label for="terms" class="terms-label">
      I agree to the
      <a
        href="https://myloan.acacceptance.com/legal/terms-of-use"
        target="_blank"
        rel="noopener noreferrer"
        class="terms-link"
        (click)="$event.stopPropagation()"
      >Terms &amp; Conditions</a>
    </label>
  </div>

  <div actions>
    <p-button
      label="Get Started"
      icon="pi pi-arrow-right"
      iconPos="right"
      (onClick)="onGetStarted()"
      [style]="{ width: '100%' }"
      [disabled]="!termsAccepted"
      size="large"
      styleClass="aca-btn-primary"
    />
  </div>

  <p footer>
    Your account setup is quick, easy, and secure.
  </p>
</app-registration-layout>
